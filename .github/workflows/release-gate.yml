name: Release Gate

# Install simulation on three runners is the costly part of CI, so it runs only
# when a release is cut (a vX.Y.Z tag push), on demand from the Actions tab, or
# on a PR carrying the run-installer-tests label. On an unlabeled PR both jobs
# are skipped and use no runner minutes. The lint and packaging checks stay in
# ci.yml and still run on every PR.
on:
  push:
    # In filter globs `*` also matches `-`, so v*.*.* alone would match
    # pre-release tags such as v2.2.0-rc.1. The negated pattern drops them.
    tags:
      - 'v*.*.*'
      - '!v*-*'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

# Runs that will skip both jobs (an unrelated label, a push to an unlabeled PR)
# get their own group, so they never cancel a real run in progress.
concurrency:
  group: release-gate-${{ github.ref }}-${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-installer-tests') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-installer-tests')) }}
  cancel-in-progress: true

jobs:
  installer:
    name: Bash installer (${{ matrix.os }})
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-installer-tests') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-installer-tests')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Stub RTK required by the installer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' '#!/usr/bin/env sh' 'exit 0' > "$RUNNER_TEMP/bin/rtk"
          chmod +x "$RUNNER_TEMP/bin/rtk"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run Bash installer tests
        run: bash tests/test-install.sh

  installer-pwsh:
    name: PowerShell installer
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-installer-tests') || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-installer-tests')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub RTK required by the installer
        shell: pwsh
        run: |
          $stubDirectory = Join-Path $env:RUNNER_TEMP 'bin'
          $stubPath = Join-Path $stubDirectory 'rtk.cmd'
          New-Item -ItemType Directory -Force -Path $stubDirectory | Out-Null
          "@echo off`r`nexit /b 0" | Set-Content -Path $stubPath -Encoding ascii
          $env:PATH = "$stubDirectory;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $stubDirectory
          $resolvedStubPath = (Resolve-Path $stubPath).Path
          $resolvedCommandPath = (Get-Command rtk -ErrorAction Stop).Path
          if ($resolvedCommandPath -ne $resolvedStubPath) {
            throw "Expected Get-Command rtk to resolve $resolvedStubPath, got $resolvedCommandPath"
          }
      - name: Run PowerShell installer tests
        shell: pwsh
        run: pwsh tests/test-install.ps1
